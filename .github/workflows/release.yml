name: Release binaries

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            features: proxy
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            features: proxy
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            features: proxy
          - runner: macos-15
            target: aarch64-apple-darwin
            features: proxy
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            features: ''
            rustflags: '-C target-feature=+crt-static'
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: ${{ matrix.rustflags || '' }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_TARGET: ${{ matrix.target }}
      RELEASE_FEATURES: ${{ matrix.features }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install the repository-pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustup target add "$RELEASE_TARGET"
          rustc --version
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test release packaging
        run: cargo test --locked -p xtask
      - name: Test default and optional features on the native OS
        run: |
          cargo test --locked --target "$RELEASE_TARGET" --all-targets
          cargo test --locked --target "$RELEASE_TARGET" --all-features --all-targets
          cargo clippy --workspace --locked --target "$RELEASE_TARGET" --all-features --all-targets -- -D warnings
      - name: Build the release executable
        run: |
          feature_args=()
          if [[ -n "$RELEASE_FEATURES" ]]; then
            feature_args=(--features "$RELEASE_FEATURES")
          fi
          cargo build --release --locked --target "$RELEASE_TARGET" --bin aegis "${feature_args[@]}"
      - name: Verify the optimized Sprite service
        if: runner.os != 'Windows'
        run: cargo test --release --locked --target "$RELEASE_TARGET" --features proxy --test sprite_workflow
      - name: Package and smoke-test the extracted download
        run: >-
          cargo run --locked -p xtask -- package "$RELEASE_TAG" "$RELEASE_TARGET"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish all platform downloads
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts
      - name: Verify the complete artifact set
        run: |
          set -euo pipefail
          test "$(find artifacts -name '*.sha256' | wc -l)" -eq 5
          # Accept CRLF sidecars from older Windows packaging jobs as well.
          sed 's/\r$//' artifacts/*.sha256 > artifacts/SHA256SUMS
          cd artifacts
          sha256sum --check SHA256SUMS
      - name: Publish assets to the tagged release
        run: |
          set -euo pipefail
          printf '%s\n' \
            'Experimental Aegis binaries. Download the archive matching your OS and CPU, extract it, and run `aegis --help` (`aegis.exe --help` on Windows). No Rust installation is required.' \
            '' \
            'Linux (glibc 2.35+) and macOS include the secret-injection proxy and native Sprite HTTP/MCP client. Windows supports `demo` and `synthetic-agent`; Unix services are unavailable on Windows.' \
            '' \
            'Each archive includes installation instructions, platform limits, licenses, and build metadata. Verify your download against SHA256SUMS. These experimental binaries are not distribution-signed or notarized and do not establish production security or deployed Sprite isolation.' \
            > release-notes.md
          if gh release view "$RELEASE_TAG" --json isDraft > existing-release.json; then
            if [[ "$(jq -r .isDraft existing-release.json)" != false ]]; then
              echo '::error::The tag has an unpublished draft. Publish or remove that draft before retrying.'
              exit 1
            fi
            # A release created through GitHub's UI may already own this tag.
            # Attach the verified files to it without replacing existing assets.
            gh release upload "$RELEASE_TAG" artifacts/*.tar.gz artifacts/*.zip artifacts/SHA256SUMS
          else
            # Let gh create, upload and publish the same release by its ID.
            # A separate edit by tag can select a different pre-existing release.
            gh release create "$RELEASE_TAG" artifacts/*.tar.gz artifacts/*.zip artifacts/SHA256SUMS \
              --verify-tag --prerelease --latest=false \
              --title "Aegis $RELEASE_TAG" --notes-file release-notes.md
          fi
