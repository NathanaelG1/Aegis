[package]
name = "aegis-broker"
version = "0.1.0-experimental"
edition = "2021"
rust-version = "1.96"
description = "Synthetic-only experimental local capability broker"
publish = false
license = "MIT"
repository = "https://github.com/NathanaelG1/Aegis"

[features]
default = []
storage-spike = ["dep:age"]

[lib]
name = "aegis"

[[bin]]
name = "aegis"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
getrandom = "=0.2.17"
age = { version = "=0.11.1", default-features = false, optional = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.29.0", default-features = false, features = ["socket", "user"] }

[lints.rust]
unsafe_code = "forbid"
