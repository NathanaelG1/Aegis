[package]
name = "aegis-broker"
version = "0.1.0-experimental"
edition = "2021"
rust-version = "1.96"
description = "Synthetic-only experimental local capability broker"
publish = false
license = "MIT"
repository = "https://github.com/NathanaelG1/Aegis"
default-run = "aegis"

[features]
default = []
storage-spike = ["dep:age"]
vault-spike = ["storage-spike", "signing-spike", "dep:rustls", "dep:rcgen"]
signing-spike = ["dep:jsonwebtoken", "dep:aws-lc-rs", "dep:pkcs8", "dep:base64", "dep:zeroize"]

[lib]
name = "aegis"

[[bin]]
name = "aegis"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
getrandom = "=0.2.17"
age = { version = "=0.11.1", default-features = false, optional = true }
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["aws_lc_rs"], optional = true }
aws-lc-rs = { version = "=1.18.1", optional = true }
pkcs8 = { version = "=0.11.0", default-features = false, optional = true }
base64 = { version = "=0.22.1", optional = true }
zeroize = { version = "=1.9.0", optional = true }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "aws_lc_rs"], optional = true }
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "aws_lc_rs", "zeroize"], optional = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.29.0", default-features = false, features = ["socket", "user"] }

[lints.rust]
unsafe_code = "forbid"
